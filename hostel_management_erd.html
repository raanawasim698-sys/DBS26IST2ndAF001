
<style>
#erd { padding: 1rem 0; }
#erd svg { max-width: 100%; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2a2a' : '#f0f4ff',
    primaryBorderColor: dark ? '#4a4aaa' : '#7070cc',
  },
});

const diagram = `erDiagram
  STUDENTS {
    int student_id PK
    string full_name
    string cnic
    string roll_number
    string department
    string program
    int semester
    string contact_number
    string status
  }
  BLOCKS {
    int block_id PK
    string block_name
    int total_rooms
    int warden_id FK
  }
  ROOMS {
    int room_id PK
    string room_number
    int block_id FK
    int floor
    string room_type
    int capacity
    decimal monthly_rent
    string ac_status
    string status
  }
  ROOM_ALLOCATIONS {
    int allocation_id PK
    int student_id FK
    int room_id FK
    date allocation_date
    date end_date
  }
  STAFF {
    int staff_id PK
    string name
    string cnic
    string designation
    decimal salary
    string contact_number
    date joining_date
  }
  FEE_STRUCTURE {
    int structure_id PK
    string fee_type
    string room_type
    decimal amount
    decimal late_fine_per_day
  }
  FEE_BILLS {
    int bill_id PK
    int student_id FK
    string bill_month
    decimal amount_due
    date due_date
    string status
  }
  FEE_PAYMENTS {
    int payment_id PK
    int bill_id FK
    decimal amount_paid
    date payment_date
    string payment_method
    string receipt_number
  }
  VISITORS {
    int visitor_id PK
    string visitor_name
    string cnic
    string relation
    int student_id FK
    string purpose
    datetime entry_time
    datetime exit_time
  }
  COMPLAINTS {
    int complaint_id PK
    int student_id FK
    int assigned_to FK
    string category
    string description
    string priority
    string status
    date filed_date
    date resolved_date
  }
  MAINTENANCE_REQUESTS {
    int request_id PK
    string location
    string issue_type
    string description
    int reported_by FK
    string status
    date reported_date
    decimal cost
  }
  MEAL_PLANS {
    int plan_id PK
    string plan_name
    decimal monthly_cost
  }
  STUDENT_MEAL_PLANS {
    int smp_id PK
    int student_id FK
    int plan_id FK
    string semester
  }
  NOTICES {
    int notice_id PK
    string title
    string description
    int posted_by FK
    date post_date
    date expiry_date
    string target_audience
  }
  USERS {
    int user_id PK
    string username
    string password_hash
    string role
    int staff_id FK
  }
  AUDIT_LOGS {
    int log_id PK
    datetime log_time
    string module
    string action
    string error_message
    int user_id FK
  }
  DEPARTMENTS {
    int dept_id PK
    string dept_name
    string faculty
  }

  STUDENTS ||--o{ ROOM_ALLOCATIONS : "is assigned"
  ROOMS    ||--o{ ROOM_ALLOCATIONS : "contains"
  BLOCKS   ||--o{ ROOMS            : "has"
  STAFF    ||--o| BLOCKS           : "manages"
  STUDENTS ||--o{ FEE_BILLS        : "receives"
  FEE_BILLS ||--o{ FEE_PAYMENTS    : "paid via"
  STUDENTS ||--o{ VISITORS         : "receives"
  STUDENTS ||--o{ COMPLAINTS       : "files"
  STAFF    ||--o{ COMPLAINTS       : "resolves"
  STAFF    ||--o{ MAINTENANCE_REQUESTS : "assigned to"
  STUDENTS ||--o{ STUDENT_MEAL_PLANS : "enrolls in"
  MEAL_PLANS ||--o{ STUDENT_MEAL_PLANS : "assigned via"
  STAFF    ||--o{ NOTICES          : "posts"
  STAFF    ||--o| USERS            : "has account"
  USERS    ||--o{ AUDIT_LOGS       : "generates"
  DEPARTMENTS ||--o{ STUDENTS      : "categorizes"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
